scenarios:
  - id: ticket-create
    name: 创建 VPN 故障工单
    setup:
      user_id: U1001
      users: [{user_id: U1001, name: 张三}]
      assets: [{asset_id: PC-1001, owner_id: U1001, status: active}]
    conversation: [{user: VPN 无法连接，设备 PC-1001，请创建工单，优先级高}]
    expect:
      tools:
        - {name: query_user, arguments: {user_id: U1001}}
        - {name: query_asset, arguments: {asset_id: PC-1001}}
        - {name: create_ticket, arguments: {category: vpn, priority: high}}
      tool_order: [query_user, query_asset, create_ticket]
      business_state: [{path: metadata.ticket_status, value: created}]
      response: {contains: [工单, 已创建]}
  - id: ticket-asset-required
    name: 工单缺少设备编号
    setup: {user_id: U1001, users: [{user_id: U1001, name: 张三}]}
    conversation: [{user: VPN 故障，请创建工单}]
    expect:
      response: {contains: [设备编号]}
      business_state: [{path: metadata.ticket_status, value: asset_required}]
  - id: ticket-user-missing
    name: 工单用户不存在
    setup: {user_id: missing, users: []}
    conversation: [{user: VPN 无法连接，设备 PC-1001，请创建工单}]
    expect:
      response: {contains: [未找到当前用户]}
      business_state: [{path: metadata.ticket_status, value: user_not_found}]
  - id: ticket-owner-denied
    name: 工单资产越权
    setup:
      user_id: U1001
      users: [{user_id: U1001, name: 张三}]
      assets: [{asset_id: PC-1001, owner_id: U2002}]
    conversation: [{user: VPN 无法连接，设备 PC-1001，请创建工单}]
    expect:
      response: {contains: [不属于当前用户]}
      business_state: [{path: metadata.ticket_status, value: asset_forbidden}]
  - id: ticket-idempotent
    name: 重复工单请求幂等
    setup:
      user_id: U1001
      session_id: ticket-idempotent
      users: [{user_id: U1001, name: 张三}]
      assets: [{asset_id: PC-1001, owner_id: U1001, status: active}]
    conversation:
      - {user: VPN 无法连接，设备 PC-1001，请创建工单}
      - user: VPN 无法连接，设备 PC-1001，请创建工单
        expect: {response: {contains: [T-0001, 已创建]}}
  - id: ticket-service-5xx
    name: 工单服务 5xx
    setup:
      user_id: U1001
      users: [{user_id: U1001, name: 张三}]
      assets: [{asset_id: PC-1001, owner_id: U1001, status: active}]
      failures: {ticket: {status_code: 500, message: ticket database unavailable}}
    conversation: [{user: VPN 无法连接，设备 PC-1001，请创建工单}]
    expect:
      response: {contains: [暂时无法创建]}
      business_state: [{path: metadata.ticket_status, value: unavailable}]
