services:
  reference-agent:
    build:
      context: .
      args:
        BUILD_REV: ${BUILD_REV:-source}
    image: ${REFERENCE_AGENT_IMAGE:-llmtest-reference-agent}:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      REFERENCE_AGENT_DATABASE: ${DATABASE_PATH:-/data/reference_agent.db}
      REFERENCE_AGENT_MODEL_MODE: ${REFERENCE_AGENT_MODEL_MODE:-mock}
      REFERENCE_AGENT_PROMPT_VERSION: ${REFERENCE_AGENT_PROMPT_VERSION:-reference-agent-prompt-v1}
      REFERENCE_AGENT_KNOWLEDGE_VERSION: ${REFERENCE_AGENT_KNOWLEDGE_VERSION:-knowledge-base-v1}
      REFERENCE_AGENT_TOOLS_VERSION: ${REFERENCE_AGENT_TOOLS_VERSION:-reference-tools-v1}
      LLM_PRICING_TABLE: ${LLM_PRICING_TABLE:-}
    ports:
      - "127.0.0.1:${REFERENCE_AGENT_PORT:-8000}:8000"
    volumes:
      - reference-agent-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  reference-agent-data:
    name: ${REFERENCE_AGENT_VOLUME:-local-production-drill_reference-agent-data}
