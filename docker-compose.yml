services:
  reference-agent:
    build:
      context: .
      args:
        BUILD_REV: ${BUILD_REV:-source}
    image: ${REFERENCE_AGENT_IMAGE:-llmtest-reference-agent}:${IMAGE_TAG:-local}
    user: "10001:10001"
    restart: unless-stopped
    environment:
      REFERENCE_AGENT_DATABASE: ${DATABASE_PATH:-/data/reference_agent.db}
      REFERENCE_AGENT_MODEL_MODE: ${REFERENCE_AGENT_MODEL_MODE:-mock}
      REFERENCE_AGENT_MODEL_PROVIDER: ${REFERENCE_AGENT_MODEL_PROVIDER:-deepseek}
      REFERENCE_AGENT_MODEL: ${REFERENCE_AGENT_MODEL:-deepseek-chat}
      REFERENCE_AGENT_MODEL_BASE_URL: ${REFERENCE_AGENT_MODEL_BASE_URL:-https://api.deepseek.com}
      REFERENCE_AGENT_MODEL_API_KEY: ${REFERENCE_AGENT_MODEL_API_KEY:-}
      REFERENCE_AGENT_MODEL_TEMPERATURE: ${REFERENCE_AGENT_MODEL_TEMPERATURE:-0}
      REFERENCE_AGENT_TEST_FAULTS_ENABLED: ${REFERENCE_AGENT_TEST_FAULTS_ENABLED:-false}
      REFERENCE_AGENT_TEST_FAULT_TOKEN: ${REFERENCE_AGENT_TEST_FAULT_TOKEN:-}
      LLM_PRICING_TABLE: ${LLM_PRICING_TABLE:-}
      QE_TELEMETRY_ENDPOINT: ${QE_TELEMETRY_ENDPOINT:-}
      QE_TELEMETRY_INGEST_TOKEN: ${QE_TELEMETRY_INGEST_TOKEN:-}
      QE_TELEMETRY_HASH_KEY: ${QE_TELEMETRY_HASH_KEY:-}
      QE_TELEMETRY_RETENTION_DAYS: ${QE_TELEMETRY_RETENTION_DAYS:-30}
    ports:
      - "127.0.0.1:${REFERENCE_AGENT_PORT:-8000}:8000"
    volumes:
      - reference-agent-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  reference-agent-data:
    name: ${REFERENCE_AGENT_VOLUME:-local-production-drill_reference-agent-data}
