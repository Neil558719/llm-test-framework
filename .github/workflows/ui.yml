name: Reference Agent UI

on:
  pull_request:
    branches: [master]
  push:
    branches: ["codex/**"]

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install UI test dependencies
        run: python -m pip install -e ".[ui]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run Playwright acceptance tests
        run: pytest -m ui --junitxml=reports/ui-junit.xml
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-evidence
          path: reports/ui-junit.xml
          if-no-files-found: warn
