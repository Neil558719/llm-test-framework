name: Reference Agent UI

env:
  UV_PYTHON: python

on:
  pull_request:
    branches: [master]
  push:
    branches: [master, "codex/**"]

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install UI test dependencies
        run: uv sync --locked --extra ui
      - name: Install Chromium
        run: uv run playwright install --with-deps chromium
      - name: Verify required browser prerequisites
        run: |
          uv run python - <<'PY'
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as api:
              assert Path(api.chromium.executable_path).is_file(), "required Chromium binary missing"
          PY
      - name: Run Playwright acceptance tests
        run: uv run pytest -m ui --junitxml=reports/ui-junit.xml
      - name: Verify all five UI tests executed without skips
        run: |
          uv run python - <<'PY'
          from xml.etree import ElementTree
          cases = ElementTree.parse("reports/ui-junit.xml").findall(".//testcase")
          assert len(cases) == 5, "UI test inventory changed; update its explicit acceptance contract"
          assert all(not any(case.find(tag) is not None for tag in ("skipped", "failure", "error")) for case in cases), "UI acceptance incomplete"
          PY
      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-ui-evidence
          path: reports/ui-junit.xml
          if-no-files-found: warn
