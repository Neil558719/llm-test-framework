name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        run: uv sync --locked --extra ci

      - name: Run offline regression suite
        run: uv run pytest -q

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-python-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn

  installed-wheel:
    name: Installed wheel (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install locked dependencies without the source project
        run: uv sync --locked --extra ci --no-install-project
      - name: Build and install wheel
        run: |
          uv build --wheel
          uv pip install --python .venv/bin/python --no-deps dist/*.whl
      - name: Verify installed web assets and packaged scenarios
        run: .venv/bin/python scripts/verify_installed_wheel.py
      - name: Upload installed wheel reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: installed-wheel-python-${{ matrix.python-version }}
          path: reports/installed-wheel/
          if-no-files-found: warn

  production-hardening-contract:
    name: Production hardening contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: uv sync --locked --extra ci
      - name: Run offline production hardening contract
        run: uv run pytest -q tests/test_production_hardening_contract.py

  v1-api-gate:
    name: V1 API gate (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install test dependencies
        run: uv sync --locked --extra ci
      - name: Run V1 API E2E quality gate
        run: uv run python -m qe_platform.v1_gate --json reports/v1-api-e2e.json --html reports/v1-api-e2e.html
      - name: Upload V1 reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: v1-api-gate-python-${{ matrix.python-version }}
          path: reports/v1-api-e2e.*
          if-no-files-found: error
