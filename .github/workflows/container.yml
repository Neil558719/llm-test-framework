name: Container Readiness

on:
  pull_request:
    branches: [master]
  push:
    branches: ["codex/**"]

permissions:
  contents: read

jobs:
  local-production-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Validate deployment assets
        run: python -m pip install PyYAML pytest && python -m pytest tests/test_deployment_assets.py tests/test_deploy_scripts.py -q
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build image
        run: docker compose build reference-agent
      - name: Start and wait for health
        run: docker compose up -d --wait
      - name: Run smoke
        run: BASE_URL=http://localhost:8000 SMOKE_REPORT=reports/container-smoke.json sh deploy/smoke.sh
      - name: Verify stopped-service SQLite backup
        run: |
          docker compose stop reference-agent
          mkdir -p reports/backup
          docker run --rm -v local-production-drill_reference-agent-data:/data:ro -v "$PWD/reports/backup:/backup" alpine:3.20 cp /data/reference_agent.db /backup/reference_agent.db
          python - <<'PY'
          import sqlite3
          assert sqlite3.connect('reports/backup/reference_agent.db').execute('PRAGMA integrity_check').fetchone()[0] == 'ok'
          PY
          docker compose up -d --wait
          BASE_URL=http://localhost:8000 SMOKE_REPORT=reports/post-backup-smoke.json sh deploy/smoke.sh
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-smoke-evidence
          path: |
            reports/container-smoke.json
            reports/post-backup-smoke.json
            reports/backup/reference_agent.db
          if-no-files-found: error
      - name: Container logs
        if: always()
        run: mkdir -p reports && docker compose logs --no-color > reports/container.log || true
      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: container-logs
          path: reports/container.log
          if-no-files-found: warn
      - name: Stop drill
        if: always()
        run: docker compose down
