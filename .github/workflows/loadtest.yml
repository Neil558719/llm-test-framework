name: Standalone Load Test

on:
  pull_request:
    branches: [master]
  push:
    branches:
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: loadtest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  loadtest-contract:
    name: Load-test contract (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[ci]"
      - name: Run standalone load-test tests
        run: python -m pytest -q tests/test_loadtest_*.py
