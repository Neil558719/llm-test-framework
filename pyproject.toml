[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "llmtest"
version = "0.1.0"
description = "LLM 应用自动化测试框架：语义断言 / JSON Schema 校验 / 相似度断言 / LLM-as-Judge / 幻觉检测 / 质量报告"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "LLM Testing Team" }]
keywords = ["llm", "testing", "pytest", "evaluation", "rag", "hallucination"]
classifiers = [
    "Framework :: Pytest",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pytest>=7.0",
    "jsonschema>=4.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.27,<1.0",
    "uvicorn>=0.30,<1.0",
    "langgraph>=0.6,<1.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
real = [
    "openai>=1.0",
    "anthropic>=0.30",
]
ui = [
    "playwright>=1.45",
]
dev = [
    "pytest>=7.0",
]
ci = [
    "pytest-timeout>=2.3",
    "pytest-rerunfailures>=14.0",
]

[project.entry-points.pytest11]
llmtest = "llmtest.plugin"

[project.scripts]
v1-api-gate = "qe_platform.v1_gate:main"
llmtest-load = "qe_platform.loadtest.cli:main"
llmtest-gate = "qe_platform.loadtest.gate_cli:main"
dify-compat-gate = "qe_platform.dify_gate:main"
telemetry-prune = "qe_platform.telemetry.cli:main"

[tool.setuptools.packages.find]
include = ["llmtest*", "qe_platform*", "reference_agent*"]

[tool.setuptools.package-data]
qe_platform = ["scenarios/assets/**/*.yaml", "scenarios/assets/**/*.yml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra -m 'not ui'"
markers = [
    "ui: browser-based Playwright acceptance tests (requires the ui extra and browser binaries)",
]
